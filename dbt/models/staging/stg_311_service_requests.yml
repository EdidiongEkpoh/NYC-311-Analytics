version: 2


models:
  - name: stg_311_service_requests
    description: Deduplicated NYc 311 service requests with snake cased columns and accurate data types. 
    columns:
      - name: unique_key
        description: Unique identifier for the service requests
        tests:
          - unique
          - not_null 
    
      - name: created_date
        description: Timestamp the request was created.
        tests:
          - not_null
      
      - name: closed_date
        description: Timestamp the request was closed. Null for open/pending requests.
      
      - name: agency
        description: Abbreviation for the responding city agency (e.g. NYPD, DSNY).
      
      - name: agency_name
        description: Full name of the responding city agency.
      
      - name: complaint_type
        description: High-level complaint category.
      
      - name: descriptor
        description: Sub-category that provides more detail on the complaint_type.

      - name: location_type
        description: Type of location the complaint pertains to (e.g. "Residential Building").
      
      - name: incident_zip
        description: ZIP code of the incident. Kept as string to preserve leading structure
      
      - name: incident_address
        description: Street address of the incident, where available.

      - name: street_name 
        description: Street name of the incident, where available. 
      
      - name: borough
        description: NYC borough the request was filed in.
        tests:
          - accepted_values:
              arguments:
                values: ['BRONX', 'BROOKLYN', 'MANHATTAN', 'QUEENS', 'STATEN ISLAND']
              config:
                severity: warn
                where: "borough is not null"

      - name: status 
        description: Current status of the request.
        tests:
          - accepted_values:
              arguments:
                values: ['Open', 'Closed', 'Pending', 'Assigned', 'Canceled']
              config:
                severity: warn
                where: "status is not null"
      
      - name: resolultion_action_updated_date
        description: Timestamp the request was last updated with a resolution action. Null for open/pending requests.

      - name: community_board
        description: NYC community board the request was filed in. Null for requests outside of NYC.
      
      - name: open_data_channel_type
        description: Channel the request was filed throught (e.g "PHONE", "ONLINE", "MOBILE APP").
      
      - name: latitude
        description: Geocoded latitude of the incident.
      
      - name: longitude 
        description: Geocoded longitude of the incident.
